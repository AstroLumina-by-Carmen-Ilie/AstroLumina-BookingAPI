# =============================================================================
# AstroLumina Booking API -- Unit Tests
#
# Runs the node:test suites (via tsx) on every push to main, every pull
# request targeting main, weekly (Monday 06:00 UTC), and on manual dispatch
# -- the same trigger set as security-scan.yml so tests gate PRs.
# =============================================================================

name: Unit Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "24"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
