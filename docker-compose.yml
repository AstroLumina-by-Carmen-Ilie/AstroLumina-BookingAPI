services:
  booking:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-bookingapi:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - BOOKING_API_SERVER_PORT=${BOOKING_API_SERVER_PORT}
      - FRONTEND_SERVER_PORT=${FRONTEND_SERVER_PORT}
      - BOOKING_API_SENTRY_DSN=${BOOKING_API_SENTRY_DSN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CALCOM_API_KEY=${CALCOM_API_KEY}
      - CALCOM_BASE_URL=${CALCOM_BASE_URL}
      - R2_BASE_URL=${R2_BASE_URL}
      - D1_ACCOUNT_ID=${D1_ACCOUNT_ID}
      - D1_DATABASE_ID=${D1_DATABASE_ID}
      - D1_API_TOKEN=${D1_API_TOKEN}
    ports:
      - "${BOOKING_API_SERVER_PORT}:${BOOKING_API_SERVER_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:${BOOKING_API_SERVER_PORT}/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.125"
          memory: 128M
    networks:
      - booking-api

networks:
  booking-api:
    name: booking-api-network
    driver: bridge
